<title>LE SUR MESURE BY HMD</title>
<meta name="description" content="LE SUR MESURE BY HMD crée des portes en bois sur mesure : portes d’entrée, intérieures, modernes, classiques et vitrées. Appelez-nous pour un devis personnalisé.">
<meta property="og:title" content="LE SUR MESURE BY HMD — Portes en bois sur mesure">
<meta property="og:description" content="Des portes qui vous ressemblent : essences de bois sélectionnées, finitions choisies avec vous. Appelez-nous pour un devis.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..800;1,9..144,500..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* LAYOUT CONCEPT — atelier éditorial : bandes de couleur pleine largeur (forêt, noyer, terracotta, crème),
   la porte en arche comme motif répété, le bois présenté en échantillons tactiles. */
:root{
  /* Palette (bois, vert profond, crème, terracotta, brun, safran) */
  --cream:#F7EFE0; --sand:#EEDFC5; --ink:#3A2415; --muted:#6B5443;
  --forest:#2F4A38; --walnut:#3B2616; --terra:#B84A1F; --oak:#B9854F; --sun:#E8A33D;
  --on-dark:#F7EFE0; --on-dark-muted:rgba(247,239,224,.8);
  /* Rôles */
  --bg:var(--cream); --bg-alt:var(--sand); --fg:var(--ink); --fg-muted:var(--muted);
  --card:#FFF8EA; --line:rgba(58,36,21,.16); --accent-ink:#A8401A; --btn:#B84A1F;
  /* Typographie */
  --font-display:'Fraunces',Georgia,'Times New Roman',serif;
  --font-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  /* Formes et mouvement */
  --arch:clamp(90px,24vw,240px); --radius:20px; --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1F1812; --bg-alt:#291F17; --fg:#F3E8D6; --fg-muted:#C4B099; --card:#2B2119;
    --line:rgba(247,239,224,.16); --accent-ink:#F0A070; --btn:#C9572A;
    --forest:#233A2B; --walnut:#2D1C10; --terra:#9F3F18; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1F1812; --bg-alt:#291F17; --fg:#F3E8D6; --fg-muted:#C4B099; --card:#2B2119;
  --line:rgba(247,239,224,.16); --accent-ink:#F0A070; --btn:#C9572A;
  --forest:#233A2B; --walnut:#2D1C10; --terra:#9F3F18; color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:1rem;line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:78px}
@media (min-width:760px){body{padding-bottom:0}}
img,svg{display:block;max-width:100%}
a{color:inherit}
p{margin:0}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.05;margin:0;text-wrap:balance;overflow-wrap:break-word}
ul,ol{margin:0}
main:focus{outline:none}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:4px}
.wrap{width:100%;max-width:1240px;margin-inline:auto;padding-inline:clamp(16px,4vw,40px)}
.section{padding-block:clamp(56px,9vw,112px);scroll-margin-top:72px}
.section--alt{background:var(--bg-alt)}
.section--forest{background:var(--forest);color:var(--on-dark)}
.section--walnut{background:var(--walnut);color:var(--on-dark)}
.section--terra{background:var(--terra);color:var(--on-dark)}
.skip{position:absolute;left:16px;top:-80px;z-index:100;background:var(--sun);color:#2E1A0C;padding:10px 16px;border-radius:999px;font-weight:700;text-decoration:none}
.skip:focus{top:calc(10px + env(safe-area-inset-top,0px))}

/* ——— Titres de section ——— */
.sec-head{display:grid;gap:14px;max-width:46rem;margin-bottom:clamp(28px,5vw,56px)}
.sec-head h2,.h2{font-size:clamp(2rem,5.2vw,3.7rem);text-transform:uppercase;letter-spacing:.005em}
.eyebrow{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--accent-ink)}
.section--forest .eyebrow,.section--walnut .eyebrow,.section--terra .eyebrow,.hero .eyebrow,.page-head .eyebrow{color:var(--sun)}
.lede{font-size:clamp(1.02rem,1.6vw,1.16rem);max-width:40rem;color:var(--fg-muted)}
.section--forest .lede,.section--walnut .lede,.section--terra .lede,.hero .lede,.page-head .lede{color:var(--on-dark-muted)}

/* ——— Boutons ——— */
.btn{--b-bg:var(--btn);--b-fg:#FFF6E8;--b-bd:transparent;display:inline-flex;align-items:center;justify-content:center;gap:.65em;padding:.95em 1.5em;border-radius:999px;border:2px solid var(--b-bd);background:var(--b-bg);color:var(--b-fg);font:700 .84rem/1.15 var(--font-body);letter-spacing:.09em;text-transform:uppercase;text-decoration:none;text-align:center;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s var(--ease),background-color .25s,color .25s,border-color .25s}
.btn svg{width:1.3em;height:1.3em;flex:none;transition:transform .25s var(--ease)}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 22px -14px rgba(30,12,0,.6)}
.btn:hover .arrow{transform:translateX(4px)}
.btn:active{transform:translateY(0)}
.btn--sun{--b-bg:var(--sun);--b-fg:#2E1A0C}
.btn--sun:hover{--b-bg:#F2B755}
.btn--cream{--b-bg:var(--cream);--b-fg:#2E1A0C}
.btn--cream:hover{--b-bg:#fff}
.btn--wa{--b-bg:#2B7A4E;--b-fg:#FFF6E8}
.btn--wa:hover{--b-bg:#34905D}
.btn--ghost{--b-bg:transparent;--b-fg:var(--fg);--b-bd:var(--fg)}
.btn--ghost:hover{--b-bg:var(--fg);--b-fg:var(--bg)}
.btn--ghost-light{--b-bg:transparent;--b-fg:var(--on-dark);--b-bd:rgba(247,239,224,.65)}
.btn--ghost-light:hover{--b-bg:var(--on-dark);--b-fg:#2E1A0C}
.btn--sm{padding:.7em 1.15em;font-size:.78rem}
.btn--xl{font-size:1rem;padding:1.15em 1.8em;min-height:64px}
.btn--block{width:100%}
.link-arrow{display:inline-flex;align-items:center;gap:.4em;font-weight:700;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:inherit;border-bottom:2px solid currentColor;padding-bottom:2px}
.link-arrow svg{width:1.1em;height:1.1em}

/* ——— En-tête ——— */
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-row{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--font-display);font-weight:700;font-size:1.08rem;letter-spacing:.07em;white-space:nowrap}
.brand svg{width:24px;height:28px}
.brand__le{font-weight:500;font-style:italic;letter-spacing:.02em}
.nav-links{display:none;list-style:none;padding:0;gap:clamp(18px,2.4vw,34px)}
.nav-links a{position:relative;text-decoration:none;font-weight:600;font-size:.93rem;padding-block:6px;background:linear-gradient(var(--btn),var(--btn)) left bottom/0 2px no-repeat;transition:background-size .3s var(--ease)}
.nav-links a:hover,.nav-links a[aria-current="page"]{background-size:100% 2px}
.nav-actions{display:flex;align-items:center;gap:10px}
.nav-call span{display:none}
@media (min-width:480px){.nav-call span{display:inline}}
.menu-btn{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--fg);background:transparent;color:var(--fg);display:grid;place-items:center;cursor:pointer}
.menu-btn svg{width:22px;height:22px}
.mobile-menu{border-top:1px solid var(--line);background:var(--bg);padding-block:8px 20px;display:grid}
.mobile-menu a:not(.btn){display:block;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;font-family:var(--font-display);font-size:1.45rem;font-weight:600}
.mobile-menu .btn{margin-top:18px}
@media (min-width:960px){.nav-links{display:flex}.menu-btn,.mobile-menu{display:none!important}}

/* ——— Médias ——— */
.media{position:relative;overflow:hidden;aspect-ratio:var(--ar,4/3);max-width:100%;background:var(--bg-alt);isolation:isolate}
.media.arch{border-radius:var(--arch) var(--arch) var(--radius) var(--radius)}
.media.round{border-radius:var(--radius)}
.art{position:absolute;inset:0}
.art>img{width:100%;height:100%;object-fit:cover}
.art{transition:transform .9s var(--ease)}
.media.parallax .art{transform:translate3d(0,var(--py,0px),0) scale(1.12)}
.art>img{transition:transform .9s var(--ease)}
.hoverzoom:hover .art>img{transform:scale(1.06)}

/* ——— Hero ——— */
.hero{background:var(--forest);color:var(--on-dark);overflow:hidden;scroll-margin-top:72px}
.hero__grid{display:grid;gap:34px;align-items:center;padding-block:clamp(34px,6vw,76px)}
@media (min-width:900px){.hero__grid{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:56px}}
.hero__text{display:grid;gap:22px;justify-items:start}
.hero h1{font-size:clamp(2.2rem,5.7vw,4.5rem);text-transform:uppercase;line-height:.98;letter-spacing:-.005em}
.hero h1 em{font-style:italic;font-weight:500;color:var(--sun);text-transform:uppercase}
.hero .lede{font-size:clamp(1.05rem,1.7vw,1.22rem)}
.hero__cta{display:flex;flex-wrap:wrap;gap:12px}
.hero__call{font-size:.98rem;color:var(--on-dark-muted)}
.hero__call a{color:var(--on-dark);font-weight:700;white-space:nowrap}
.hero__media{position:relative;--ar:4/3}
@media (min-width:900px){.hero__media{--ar:1/1.08}}
.hero__media::before{content:"";position:absolute;width:72%;aspect-ratio:1;right:-14%;bottom:-16%;border-radius:50%;background:var(--terra);z-index:0}
.hero__media .media{position:relative;z-index:1;box-shadow:0 30px 50px -28px rgba(0,0,0,.65)}
.values{background:var(--sun);color:#2E1A0C}
.values ul{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;padding-block:14px}
.values li{font-weight:700;font-size:.74rem;letter-spacing:.17em;text-transform:uppercase}
.values li+li::before{content:"—";margin-right:14px;opacity:.6}

/* ——— Catégories ——— */
.grid-cats{display:grid;gap:clamp(28px,4vw,44px) clamp(18px,3vw,32px);grid-template-columns:minmax(0,1fr)}
@media (min-width:640px){.grid-cats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1000px){.grid-cats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cat{display:grid;gap:18px;align-content:start;min-width:0}
.cat__link{display:block;text-decoration:none}
.cat__body{display:grid;gap:10px;justify-items:start;padding-inline:4px}
.cat h3{font-size:clamp(1.5rem,2.4vw,1.9rem)}
.cat__body p{color:var(--fg-muted)}
.cat__count{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--accent-ink)}
.cat .btn{margin-top:6px}
.cat .media{--arch:min(46%,170px)}

/* ——— Essences ——— */
.grid-woods{display:grid;gap:clamp(22px,3vw,34px);grid-template-columns:minmax(0,1fr)}
@media (min-width:560px){.grid-woods{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:960px){.grid-woods{grid-template-columns:repeat(3,minmax(0,1fr))}}
.wood{display:grid;gap:16px;align-content:start;min-width:0;transition:transform .5s var(--ease)}
.wood:hover{transform:translateY(-6px) rotate(-.4deg)}
.wood .media{border-radius:14px;box-shadow:0 22px 34px -20px rgba(0,0,0,.75),inset 0 0 0 1px rgba(255,255,255,.08)}
.wood .media::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,236,200,.22),inset 0 -50px 60px -46px rgba(0,0,0,.55)}
.wood h3{font-size:clamp(1.6rem,2.4vw,2.1rem)}
.wood p{color:var(--on-dark-muted);font-size:.98rem}
.tags{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0}
.tags li{font-size:.76rem;font-weight:600;letter-spacing:.06em;padding:5px 12px;border-radius:999px;border:1px solid currentColor}
.wood .tags li{border-color:rgba(247,239,224,.4)}

/* ——— Personnalisation ——— */
.custom{display:grid;gap:36px}
@media (min-width:900px){.custom{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:72px}.custom__intro{position:sticky;top:110px;align-self:start}}
.custom__intro{display:grid;gap:22px;justify-items:start}
.opts{list-style:none;padding:0;display:grid}
.opt{display:grid;grid-template-columns:52px minmax(0,1fr);gap:2px 18px;padding-block:18px;border-top:1px solid rgba(247,239,224,.32)}
.opt:last-child{border-bottom:1px solid rgba(247,239,224,.32)}
.opt__ic{grid-row:span 2;width:52px;height:52px;border-radius:50%;background:rgba(247,239,224,.16);display:grid;place-items:center;transition:background-color .3s,transform .3s var(--ease)}
.opt:hover .opt__ic{background:var(--sun);color:#2E1A0C;transform:rotate(-6deg)}
.opt__ic svg{width:26px;height:26px}
.opt h3{font-size:1.3rem}
.opt p{color:var(--on-dark-muted);font-size:.98rem}

/* ——— À propos ——— */
.about{display:grid;gap:36px;align-items:center}
@media (min-width:900px){.about{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:72px}}
.about__text{display:grid;gap:20px;justify-items:start}
.about__text .lede{color:var(--fg)}
.ph{display:inline-block;outline:1.5px dashed var(--accent-ink);outline-offset:4px;border-radius:4px;color:var(--accent-ink);font-size:.95rem}
.vals{display:grid;gap:18px 28px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));list-style:none;padding:0;margin-top:6px;width:100%}
.vals li{border-top:2px solid var(--btn);padding-top:12px}
.vals h3{font-size:1.25rem;margin-bottom:4px}
.vals p{color:var(--fg-muted);font-size:.96rem}
.about .media{--ar:4/3}
@media (min-width:900px){.about .media{--ar:4/5}}

/* ——— Contact ——— */
.contact{display:grid;gap:40px}
@media (min-width:960px){.contact{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:72px;align-items:start}}
.contact__main{display:grid;gap:22px;justify-items:start}
.contact__main h2{font-size:clamp(2.2rem,6vw,4.2rem);text-transform:uppercase}
.bigphone{display:grid;gap:10px;justify-items:start;width:100%;padding-top:6px}
.bigphone .btn{width:100%;max-width:520px}
.phone-num{font-family:var(--font-display);font-weight:600;font-size:clamp(1.8rem,5vw,2.7rem);letter-spacing:.01em;user-select:all;-webkit-user-select:all}
.copy{background:none;border:0;color:var(--on-dark);font:600 .85rem var(--font-body);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 0}
.prep{background:rgba(247,239,224,.09);border:1px solid rgba(247,239,224,.2);border-radius:16px;padding:20px 22px;width:100%}
.prep h3{font-size:1.15rem;margin-bottom:10px}
.prep ul{padding-left:1.1rem;display:grid;gap:6px;color:var(--on-dark-muted)}
.clist{list-style:none;padding:0;display:grid;gap:14px}
.ccard{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;background:rgba(247,239,224,.09);border:1px solid rgba(247,239,224,.22);border-radius:16px;padding:18px 20px}
.ccard__ic{width:46px;height:46px;border-radius:50%;background:var(--sun);color:#2E1A0C;display:grid;place-items:center;flex:none}
.ccard__ic svg{width:22px;height:22px}
.ccard__t{flex:1 1 190px;min-width:0}
.ccard__l{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--sun)}
.ccard__v{font-weight:600;font-size:1.05rem;overflow-wrap:anywhere}

/* ——— Pages collection et porte ——— */
.page-head{background:var(--forest);color:var(--on-dark)}
.page-head__grid{display:grid;gap:30px;align-items:center;padding-block:clamp(30px,5vw,64px)}
@media (min-width:860px){.page-head__grid{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:56px}}
.page-head__text{display:grid;gap:18px;justify-items:start}
.page-head h1{font-size:clamp(2.2rem,5.6vw,4.2rem);text-transform:uppercase}
.page-head .media{--ar:5/4;--arch:min(46%,170px)}
.crumbs{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.crumbs li+li::before{content:"/";margin-right:10px;opacity:.55}
.crumbs a{text-decoration:none;opacity:.85}
.crumbs a:hover{opacity:1;text-decoration:underline}
.crumbs--ink{color:var(--fg-muted)}
.grid-products{display:grid;gap:clamp(20px,3vw,32px);grid-template-columns:minmax(0,1fr)}
@media (min-width:700px){.grid-products{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pcard{display:grid;grid-template-rows:auto 1fr;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;min-width:0;transition:transform .4s var(--ease),box-shadow .4s var(--ease)}
.pcard:hover{transform:translateY(-4px);box-shadow:0 24px 40px -28px rgba(30,12,0,.55)}
.pcard__img{position:relative;display:block;text-decoration:none}
.wood-badge{position:absolute;left:14px;bottom:14px;z-index:3;display:inline-flex;align-items:center;gap:8px;background:rgba(30,12,0,.72);color:#fff;font-size:.76rem;font-weight:600;letter-spacing:.06em;padding:6px 12px;border-radius:999px}
.wood-badge i{width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(255,255,255,.8)}
.pcard__body{display:grid;gap:12px;align-content:start;padding:22px}
.pcard h3{font-size:clamp(1.5rem,2.2vw,1.8rem)}
.pcard__body>p{color:var(--fg-muted)}
.pcard .tags li{border-color:var(--line);font-weight:500;color:var(--fg-muted)}
.pcard__act{display:grid;gap:10px;margin-top:6px}
.pd{display:grid;gap:32px;padding-block:clamp(28px,5vw,64px)}
@media (min-width:900px){.pd{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:64px;align-items:start}.pd__media{position:sticky;top:96px}}
.pd__media .media{--ar:4/3;--arch:clamp(90px,24vw,230px)}
@media (min-width:900px){.pd__media .media{--ar:4/5}}
.pd__info{display:grid;gap:20px;justify-items:start}
.pd__info h1{font-size:clamp(2.2rem,5vw,3.6rem);text-transform:uppercase}
.wood-line{display:inline-flex;align-items:center;gap:10px;font-weight:600}
.wood-line i{width:18px;height:18px;border-radius:50%;border:2px solid var(--fg)}
.pd__opts{list-style:none;padding:0;display:grid;gap:10px;width:100%;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}

/* ════════════════════════════════════════════════════════════════
   7. ROUTAGE (adresses #accueil, #collection-…, #porte-…)
   ════════════════════════════════════════════════════════════════ */
const main = document.getElementById('main');
const state = { view: null, tok: null };

function resolve(tok) {
  if (tok.indexOf('collection-') === 0) { const c = CATS.find(x => 'collection-' + x.id === tok); if (c) return { type:'cat', c }; }
  if (tok.indexOf('porte-') === 0)      { const p = P.find(x => 'porte-' + x.id === tok);          if (p) return { type:'prod', p }; }
  return { type:'home', anchor: ANCHORS.indexOf(tok) > -1 ? tok : 'accueil' };
}

function route(tok, force) {
  tok = tok || 'accueil';
  const v = resolve(tok), key = v.type === 'home' ? 'home' : tok;
  const changed = key !== state.view;
  if (!changed && tok === state.tok && !force) return;
  if (changed) {
    main.innerHTML = v.type === 'home' ? HomeView() : v.type === 'cat' ? CategoryView(v.c) : ProductView(v.p);
    document.title = v.type === 'cat' ? `${v.c.title} — ${CONFIG.brand}` : v.type === 'prod' ? `${v.p.name} — ${CONFIG.brand}` : CONFIG.brand;
    if (state.view && !reduce) main.animate([{ opacity:0, transform:'translateY(12px)' }, { opacity:1, transform:'none' }], { duration:420, easing:'cubic-bezier(.2,.7,.2,1)' });
    state.view = key;
    observeReveals();
  }
  state.tok = tok;
  closeMenu();
  requestAnimationFrame(() => {
    const smooth = !changed && !reduce;
    const target = v.type === 'home' && v.anchor !== 'accueil' ? document.getElementById(v.anchor) : null;
    if (target) target.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block:'start' });
    else window.scrollTo({ top:0, behavior: smooth ? 'smooth' : 'auto' });
    updateParallax();
  });
}

function navigate(tok) {
  route(tok, true);
  try { if (location.hash !== '#' + tok) history.pushState(null, '', '#' + tok); } catch (e) {}
}
const hashTok = () => { try { return decodeURIComponent(location.hash.replace(/^#/, '')); } catch (e) { return ''; } };
addEventListener('popstate', () => route(hashTok()));
addEventListener('hashchange', () => route(hashTok()));

document.addEventListener('click', e => {
  const copyBtn = e.target.closest('[data-copy]');
  if (copyBtn) { copyText(copyBtn); return; }
  const a = e.target.closest('a[href^="#"]');
  if (!a) return;
  e.preventDefault();
  const tok = a.getAttribute('href').slice(1);
  if (tok === 'main') { main.focus({ preventScroll:false }); return; }
  navigate(tok);
});

/* ——— Menu mobile ——— */
function closeMenu() {
  const b = document.getElementById('menuBtn'), m = document.getElementById('mobileMenu');
  if (!b || !m || m.hidden) return;
  m.hidden = true; b.setAttribute('aria-expanded', 'false'); b.setAttribute('aria-label', 'Ouvrir le menu'); b.innerHTML = I.menu;
}
document.addEventListener('click', e => {
  const b = e.target.closest('#menuBtn'); if (!b) return;
  const m = document.getElementById('mobileMenu'), open = m.hidden;
  m.hidden = !open; b.setAttribute('aria-expanded', String(open)); b.setAttribute('aria-label', open ? 'Fermer le menu' : 'Ouvrir le menu'); b.innerHTML = open ? I.close : I.menu;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenu(); const b = document.getElementById('menuBtn'); if (b) b.focus(); } });

/* ——— Photo introuvable : on la masque (le fond chaud reste) et on le signale dans la console ——— */
document.addEventListener('error', e => {
  if (e.target && e.target.tagName === 'IMG') { e.target.style.visibility = 'hidden'; console.warn('Photo introuvable :', e.target.getAttribute('src')); }
}, true);

/* ——— Copier le numéro ——— */
function copyText(btn) {
  const txt = btn.getAttribute('data-copy'), orig = btn.textContent;
  const done = ok => { btn.textContent = ok ? 'Numéro copié' : 'Sélectionnez le numéro ci-dessus'; setTimeout(() => { btn.textContent = orig; }, 2200); };
  const fallback = () => { const n = document.getElementById('phoneNum'); if (n) { const r = document.createRange(); r.selectNodeContents(n); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } done(false); };
  try { navigator.clipboard.writeText(txt).then(() => done(true), fallback); } catch (e) { fallback(); }
}

/* ——— Apparition douce au défilement ——— */
let io = null;
function observeReveals() {
  const els = main.querySelectorAll('[data-reveal]:not(.in)');
  if (!('IntersectionObserver' in window)) { els.forEach(el => el.classList.add('in')); return; }
  if (!io) io = new IntersectionObserver(entries => entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } }), { threshold:.12, rootMargin:'0px 0px -6% 0px' });
  els.forEach(el => io.observe(el));
}

/* ——— Parallaxe légère ——— */
let ticking = false;
function updateParallax() {
  ticking = false; if (reduce) return;
  const vh = innerHeight;
  document.querySelectorAll('.media.parallax').forEach(m => {
    const r = m.getBoundingClientRect(); if (r.bottom < 0 || r.top > vh) return;
    m.style.setProperty('--py', (((r.top + r.height / 2 - vh / 2) / vh) * -28).toFixed(1) + 'px');
  });
}
addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(updateParallax); } }, { passive:true });
addEventListener('resize', updateParallax);

{                                                         // données structurées pour les moteurs de recherche
  const data = { '@context':'https://schema.org', '@type':'HomeAndConstructionBusiness', name:CONFIG.brand, telephone:CONFIG.phoneTel, email:CONFIG.email, hasMap:CONFIG.mapsUrl,
    description:'Portes en bois sur mesure : portes d’entrée, intérieures, modernes, classiques et vitrées.' };

  const ld = document.createElement('script'); ld.type = 'application/ld+json';
  ld.textContent = JSON.stringify(data);
  document.head.appendChild(ld);
}
route(hashTok());
})();
